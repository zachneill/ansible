- name: Install Tailscale
  block:
    - name: Add Tailscale repository
      get_url:
        url: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        dest: /etc/yum.repos.d/tailscale.repo
        mode: '0644'

    - name: Install Tailscale
      dnf:
        name: tailscale
        state: present
      
    - name: Enable IP forwarding
      lineinfile: 
        path: /etc/sysctl.d/99-tailscale.conf
        search_string: "{{ item }}"
        line: "{{ item }}"
        create: true 
      loop:
        - 'net.ipv4.ip_forward = 1'
        - 'net.ipv6.conf.all.forwarding = 1'

    - name: Apply sysctl settings
      shell: sysctl -p /etc/sysctl.d/99-tailscale.conf

    - name: Enable and start Tailscale service
      systemd:
        name: tailscaled
        enabled: true
        state: started

- name: App repo work 
  block:
    - name: Create directories
      file: 
        path: "/opt/loc_admin/app"
        state: directory

    - name: Clone app repo 
      git: 
        repo: https://github.com/zachneill/app.git
        dest: "/opt/loc_admin/app"
        version: main
    
    - name: Copy rootCA to system anchors directory
      copy:
        src: /opt/loc_admin/app/certs/rootCA.pem
        dest: /etc/pki/ca-trust/source/anchors/rootCA.pem
        owner: root
        group: root
        mode: '0644'
        remote_src: true

    - name: Update certs
      shell: update-ca-trust