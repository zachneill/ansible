- name: Prework 
  block: 
    - name: Update and upgrade all packages
      dnf:
        name: "*"
        state: latest
        update_cache: yes

    - name: Install packages
      dnf:
        name: 
          - qemu-guest-agent
          - net-tools
          - curl
          - git
          - realmd 
          - sssd 
          - adcli
          - samba-common-tools
          - oddjob 
          - oddjob-mkhomedir
          - krb5-workstation
          - whois
        state: present

    - name: Enable qemu (but don't start it)
      systemd: 
        name: qemu-guest-agent
        enabled: true
  become: true

- name: Install Docker 
  block: 
    - name: Add Docker CE repository
      get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'

    - name: Install Docker CE
      dnf:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Create groups
      group:
        name: docker
        state: present
  become: true

- name: Domain work
  block: 
    - name: Enable and start oddjob service
      systemd:
        name: oddjobd
        enabled: true
        state: started

    - name: Auto-make home directory 
      shell: authselect select sssd with-mkhomedir
  become: true

- name: Install Tailscale
  block:
    - name: Add Tailscale repository
      get_url:
        url: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        dest: /etc/yum.repos.d/tailscale.repo
        mode: '0644'

    - name: Install Tailscale
      dnf:
        name: tailscale
        state: present
      
    - name: Enable IP forwarding
      lineinfile: 
        path: /etc/sysctl.d/99-tailscale.conf
        search_string: "{{ item }}"
        line: "{{ item }}"
        create: true 
      loop:
        - 'net.ipv4.ip_forward = 1'
        - 'net.ipv6.conf.all.forwarding = 1'

    - name: Apply sysctl settings
      shell: sysctl -p /etc/sysctl.d/99-tailscale.conf

    - name: Enable and start Tailscale service
      systemd:
        name: tailscaled
        enabled: true
        state: started
  become: true

- name: App repo work 
  block:
    - name: Create directory
      file: 
        path: "/opt/loc_admin/app"
        state: directory
        owner: packer
      become: true

    - name: Clone app repo 
      git: 
        repo: https://github.com/zachneill/app.git
        dest: "/opt/loc_admin/app"
        version: main
    
    - name: Copy rootCA to system anchors directory
      copy:
        src: /opt/loc_admin/app/certs/rootCA.pem
        dest: /etc/pki/ca-trust/source/anchors/rootCA.pem
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      become: true

    - name: Update certs
      shell: update-ca-trust
      become: true