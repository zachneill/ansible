- name: Prework 
  block: 
    - name: Update and upgrade all packages
      dnf:
        name: "*"
        state: latest
        update_cache: yes

    - name: Install packages
      dnf:
        name: 
          - qemu-guest-agent
          - net-tools
          - curl
          - git
          - realmd 
          - sssd 
          - adcli
          - samba-common-tools
          - oddjob 
          - oddjob-mkhomedir
          - krb5-workstation
          - whois
        state: present

    - name: Enable qemu (but don't start it)
      systemd: 
        name: qemu-guest-agent
        enabled: true

- name: Install Docker 
  block: 
    - name: Install packages
      dnf:
        name: kernel-modules-extra
        state: present

    - name: Depmod to rebuild module dependencies
      shell: depmod -a

    - name: Add Docker CE repository
      get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'

    - name: Install Docker CE
      dnf:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Create groups
      group:
        name: "{{ item }}"
        state: present
      loop:
        - docker
        - sudo

    - name: Add the user loc_admin 
      user:
        name: loc_admin
        comment: Local Admin User
        create_home: true 
        shell: /bin/bash
        groups: sudo,docker
        append: true 

- name: Domain work
  block: 
    - name: Enable and start oddjob service
      systemd:
        name: oddjobd
        enabled: true
        state: started

    # - name: Join the domain
